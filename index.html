<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Análise de Incidência</title>
  <style>
    :root{font-family:"Segoe UI",Arial,sans-serif;color:#202938;background:#f3f4f6}*{box-sizing:border-box}body{margin:0;background:#f3f4f6}.topbar{height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 32px;border-bottom:1px solid #dfe3e8;background:#fff}.topbar strong{font-size:15px}.topbar span{color:#667085;font-size:12px}.page{width:min(1440px,100%);margin:0 auto;padding:28px 32px 44px}.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:18px}.page-head h1{margin:0;font-size:24px;font-weight:650;letter-spacing:-.025em}.page-head p{margin:5px 0 0;color:#667085;font-size:13px}.panel{padding:20px;border:1px solid #dfe3e8;border-radius:7px;background:#fff}.panel-head{display:flex;align-items:flex-start;justify-content:space-between;gap:24px;margin-bottom:18px}.panel-head h2{margin:0;font-size:16px}.panel-head p{margin:4px 0 0;color:#667085;font-size:12px}.field{display:grid;gap:6px;color:#5e6978;font-size:10px;font-weight:700;text-transform:uppercase}.field select,.field input{height:39px;padding:0 11px;border:1px solid #cdd3dc;border-radius:5px;background:#fff;color:#263244;font:inherit;font-size:13px;text-transform:none;outline:0}.field select:focus,.field input:focus{border-color:#4b79aa;box-shadow:0 0 0 2px #4b79aa18}.contest-field{width:min(430px,100%)}.summary{display:grid;grid-template-columns:repeat(6,1fr);overflow:hidden;margin-bottom:20px;border:1px solid #dfe3e8;border-radius:6px}.metric{min-height:76px;display:grid;align-content:center;gap:7px;padding:13px 15px;border-right:1px solid #e4e7eb}.metric:last-child{border-right:0}.metric span{color:#667085;font-size:10px}.metric b{font-size:22px;font-weight:650}.filters{display:grid;grid-template-columns:1fr 1fr 1.25fr;gap:10px;margin-bottom:16px}.section{margin-top:16px;padding:16px;border:1px solid #dfe3e8;border-radius:6px}.section-heading{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:13px}.eyebrow{color:#476d99;font-size:9px;font-weight:800;letter-spacing:.09em}.section-heading h3{margin:4px 0 0;font-size:16px}.section-heading small{color:#667085}.overview-row{display:grid;grid-template-columns:minmax(220px,1.15fr) minmax(180px,1fr) 60px;align-items:center;gap:15px;padding:10px 5px;border-bottom:1px solid #e9ecf0}.overview-row:last-child{border-bottom:0}.overview-label{display:flex;align-items:center;justify-content:space-between;gap:12px}.overview-label b{overflow:hidden;font-size:12px;text-overflow:ellipsis;white-space:nowrap}.overview-label span{flex:none;color:#667085;font-size:10px}.bar{height:5px;overflow:hidden;border-radius:2px;background:#e8edf2}.bar i{display:block;height:100%;border-radius:2px;background:#4c82b8}.percentage{color:#315f92;font-size:12px;text-align:right}.details{margin-top:22px}.block{overflow:hidden;margin:0 0 14px;border:1px solid #d6dde6;border-radius:6px;background:#fff}.block>header{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:14px 16px;border-bottom:1px solid #dfe4ea;background:#f4f6f8}.block h3,.subject h4{margin:4px 0 0}.block h3{font-size:16px}.block header strong,.subject header strong{font-size:11px;font-weight:650}.block header em,.subject header em{color:#315f92;font-style:normal}.subjects{padding:10px}.subject{overflow:hidden;margin-bottom:10px;border:1px solid #dde2e8;border-radius:4px}.subject:last-child{margin-bottom:0}.subject>header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:13px 15px;background:#fafafa;border-bottom:1px solid #e6e9ed}.subject h4{font-size:14px}.topics{padding:3px 11px 7px}.topic{border-bottom:1px solid #edf0f3}.topic:last-child{border-bottom:0}.topic-toggle{width:100%;display:grid;grid-template-columns:20px minmax(180px,1fr) 58px 60px;align-items:center;gap:12px;padding:12px 4px;border:0;background:transparent;color:inherit;text-align:left;cursor:pointer}.topic-toggle:hover{background:#f6f7f8}.arrow{color:#537aa2;font-size:20px;transition:transform .15s}.topic.open .arrow{transform:rotate(90deg)}.topic-name{display:grid;gap:7px}.topic-name b{font-size:12px}.topic-count{font-size:11px;text-align:right}.subtopics{margin:0 4px 8px 32px;padding:3px 10px;border-left:2px solid #7196bc;background:#f7f8fa}.subtopic{display:grid;grid-template-columns:minmax(180px,1fr) 55px 60px 94px;align-items:center;gap:10px;padding:9px 6px;border-bottom:1px solid #e5e9ed}.subtopic:last-child{border-bottom:0}.subtopic span{font-size:11px}.subtopic b{font-size:11px;text-align:right}.subtopic button,.close{height:29px;border:1px solid #cbd9e8;border-radius:4px;background:#f4f7fa;color:#315f92;font-size:10px;font-weight:700;cursor:pointer}.empty{padding:30px;color:#667085;text-align:center}.modal-backdrop{position:fixed;inset:0;z-index:10;display:grid;place-items:center;padding:22px;background:#172033a8}.modal{width:min(820px,100%);max-height:88vh;display:grid;grid-template-rows:auto minmax(0,1fr);overflow:hidden;border-radius:8px;background:#fff;box-shadow:0 20px 50px #11182740}.modal>header{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;padding:17px 20px;border-bottom:1px solid #e1e5ea}.modal h2{margin:4px 0 0;font-size:18px}.close{width:32px;font-size:20px}.modal-body{overflow:auto;padding:17px 20px}.question{padding:15px;border:1px solid #e1e5ea;border-radius:5px}.question+.question{margin-top:10px}.question-number{margin-bottom:8px;color:#315f92;font-size:10px;font-weight:800;text-transform:uppercase}.question p{margin:0;font-size:13px;line-height:1.55;white-space:pre-wrap}.alternatives{display:grid;gap:6px;margin-top:12px}.alternative{display:grid;grid-template-columns:25px 1fr;gap:8px;padding:8px 9px;border:1px solid #e6e9ed;border-radius:4px;background:#f8f9fa;font-size:12px;line-height:1.4}.alternative b{color:#315f92}.hidden{display:none!important}@media(max-width:1050px){.summary{grid-template-columns:repeat(3,1fr)}.metric:nth-child(3){border-right:0}.metric:nth-child(-n+3){border-bottom:1px solid #e4e7eb}}@media(max-width:760px){.topbar{padding:0 16px}.page{padding:20px 14px}.page-head,.panel-head,.block>header,.subject>header{align-items:stretch;flex-direction:column}.contest-field{width:100%}.summary{grid-template-columns:repeat(2,1fr)}.metric{border-right:1px solid #e4e7eb;border-bottom:1px solid #e4e7eb}.metric:nth-child(2n){border-right:0}.metric:nth-last-child(-n+2){border-bottom:0}.filters{grid-template-columns:1fr}.overview-row{grid-template-columns:1fr 55px}.overview-label{grid-column:1/-1}.topic-toggle{grid-template-columns:20px 1fr 50px}.topic-toggle>.percentage{display:none}.subtopics{margin-left:22px}.subtopic{grid-template-columns:1fr 50px}.subtopic>.percentage{grid-column:2}.subtopic button{grid-column:1/-1;width:max-content}.modal-backdrop{padding:8px}}
  </style>
</head>
<body>
  <header class="topbar"><strong>Análise de Incidência</strong><span id="snapshot"></span></header>
  <main class="page">
    <div class="page-head"><div><h1>Resultado da incidência</h1><p>Visão consolidada das classificações cadastradas.</p></div></div>
    <section class="panel">
      <div class="panel-head"><div><h2>Incidência por concurso</h2></div><label class="field contest-field">Concurso<select id="contest"></select></label></div>
      <div class="summary" id="summary"></div>
      <div class="filters"><label class="field">Filtrar por bloco<select id="block-filter"></select></label><label class="field">Filtrar por matéria<select id="subject-filter"></select></label><label class="field">Buscar<input id="search" placeholder="Bloco, matéria, tópico ou subtópico"></label></div>
      <section class="section"><div class="section-heading"><div><span class="eyebrow">VISÃO GERAL</span><h3>Resumo por matéria</h3></div><small id="subject-count"></small></div><div id="overview"></div></section>
      <div class="details"><div class="section-heading"><div><span class="eyebrow">DETALHAMENTO</span><h3>Blocos, matérias, tópicos e subtópicos</h3></div></div><div id="details"></div></div>
    </section>
  </main>
  <div class="modal-backdrop hidden" id="modal"><section class="modal" role="dialog" aria-modal="true"><header><div><span class="eyebrow" id="modal-context"></span><h2 id="modal-title"></h2></div><button class="close" id="modal-close" aria-label="Fechar">×</button></header><div class="modal-body" id="modal-body"></div></section></div>
  <script src="./incidencia-data.js"></script>
  <script>
    (()=>{
      const data=window.NOELBIA_INCIDENCE_DATA;const $=id=>document.getElementById(id);const state={contestId:data?.contests?.[0]?.id||"",block:"",subject:"",search:"",open:new Set()};
      const esc=value=>String(value??"").replace(/[&<>"']/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[char]));
      const norm=value=>String(value||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().trim();const pct=value=>Number(value||0).toLocaleString("pt-BR",{minimumFractionDigits:1,maximumFractionDigits:1})+"%";
      const contest=()=>data.contests.find(item=>item.id===state.contestId)||data.contests[0];
      function filteredSubjects(current){const term=norm(state.search);const source=state.block?(current.blocks.find(block=>block.id===state.block)?.subjects||[]):current.subjects;return source.flatMap(subject=>{if(state.subject&&subject.id!==state.subject)return[];if(!term)return[subject];const sm=norm(subject.name).includes(term);const topics=subject.topics.flatMap(topic=>{const tm=norm(topic.name).includes(term);const subs=topic.subtopics.filter(sub=>norm(sub.name).includes(term));return sm||tm?[topic]:subs.length?[{...topic,subtopics:subs}]:[]});return sm||topics.length?[{...subject,topics}]:[]})}
      function filteredBlocks(current){const term=norm(state.search);return current.blocks.flatMap(block=>{if(state.block&&block.id!==state.block)return[];const bm=term&&norm(block.name).includes(term);const subjects=block.subjects.flatMap(subject=>{if(state.subject&&subject.id!==state.subject)return[];if(!term||bm)return[subject];const sm=norm(subject.name).includes(term);const topics=subject.topics.flatMap(topic=>{const tm=norm(topic.name).includes(term);const subs=topic.subtopics.filter(sub=>norm(sub.name).includes(term));return sm||tm?[topic]:subs.length?[{...topic,subtopics:subs}]:[]});return sm||topics.length?[{...subject,topics}]:[]});return bm||subjects.length?[{...block,subjects}]:[]})}
      function render(){const current=contest();if(!current){$("summary").innerHTML='<div class="empty">Nenhum dado disponível.</div>';return}const labels=[["Questões analisadas",current.summary.questions],["Provas processadas",current.summary.exams],["Blocos encontrados",current.summary.blocks],["Matérias encontradas",current.summary.subjects],["Tópicos encontrados",current.summary.topics],["Subtópicos encontrados",current.summary.subtopics]];$("summary").innerHTML=labels.map(([label,value])=>`<div class="metric"><span>${label}</span><b>${value}</b></div>`).join("");
        $("block-filter").innerHTML='<option value="">Todos os blocos</option>'+current.blocks.map(block=>`<option value="${esc(block.id)}" ${block.id===state.block?"selected":""}>${esc(block.name)}</option>`).join("");$("subject-filter").innerHTML='<option value="">Todas as matérias</option>'+current.subjects.map(subject=>`<option value="${esc(subject.id)}" ${subject.id===state.subject?"selected":""}>${esc(subject.name)}</option>`).join("");
        const subjects=filteredSubjects(current);$("subject-count").textContent=`${subjects.length} ${subjects.length===1?"matéria":"matérias"}`;$("overview").innerHTML=subjects.length?subjects.map(subject=>`<div class="overview-row"><div class="overview-label"><b>${esc(subject.name)}</b><span>${subject.question_count} ${subject.question_count===1?"questão":"questões"}</span></div><div class="bar"><i style="width:${subject.percentage}%"></i></div><strong class="percentage">${pct(subject.percentage)}</strong></div>`).join(""):'<div class="empty">Nenhuma matéria encontrada.</div>';
        const blocks=filteredBlocks(current);$("details").innerHTML=blocks.length?blocks.map(block=>`<section class="block"><header><div><span class="eyebrow">BLOCO DE CONHECIMENTO</span><h3>${esc(block.name)}</h3></div><strong>${block.question_count} questões · <em>${pct(block.percentage)} da base</em></strong></header><div class="subjects">${block.subjects.map(subject=>`<article class="subject"><header><div><span class="eyebrow">MATÉRIA</span><h4>${esc(subject.name)}</h4></div><strong>${subject.question_count} questões · <em>${pct(subject.percentage)} da base</em></strong></header><div class="topics">${subject.topics.map(topic=>{const key=block.id+":"+topic.id;const auto=norm(state.search)&&topic.subtopics.some(sub=>norm(sub.name).includes(norm(state.search)));const open=state.open.has(key)||auto;return`<div class="topic ${open?"open":""}"><button class="topic-toggle" data-topic="${esc(key)}"><span class="arrow">›</span><span class="topic-name"><b>${esc(topic.name)}</b><span class="bar"><i style="width:${topic.percentage}%"></i></span></span><span class="topic-count">${topic.question_count} q.</span><strong class="percentage">${pct(topic.percentage)}</strong></button>${open?`<div class="subtopics">${topic.subtopics.length?topic.subtopics.map(sub=>`<div class="subtopic"><span>${esc(sub.name)}</span><b>${sub.question_count} q.</b><strong class="percentage">${pct(sub.percentage)}</strong><button data-subtopic="${esc(sub.id)}" data-context="${esc(subject.name+" · "+topic.name)}" data-title="${esc(sub.name)}">Ver questões</button></div>`).join(""):'<div class="empty">Nenhum subtópico identificado.</div>'}</div>`:""}</div>`}).join("")}</div></article>`).join("")}</div></section>`).join(""):'<div class="empty">Nenhum resultado encontrado para os filtros informados.</div>';
      }
      function showQuestions(button){const current=contest();const questions=current.questions_by_subtopic[button.dataset.subtopic]||[];$("modal-context").textContent=button.dataset.context;$("modal-title").textContent=button.dataset.title;$("modal-body").innerHTML=questions.length?questions.map(question=>`<article class="question"><div class="question-number">Questão ${question.question_number??"—"}</div><p>${esc(question.statement)}</p>${question.alternatives.length?`<div class="alternatives">${question.alternatives.map(alt=>`<div class="alternative"><b>${esc(alt.option_key)}</b><span>${esc(alt.content)}</span></div>`).join("")}</div>`:""}</article>`).join(""):'<div class="empty">Nenhuma questão encontrada.</div>';$("modal").classList.remove("hidden")}
      $("contest").innerHTML=data.contests.map(item=>`<option value="${esc(item.id)}">${esc(item.position_name)} — ${esc(item.organization)}</option>`).join("");$("contest").value=state.contestId;$("snapshot").textContent="Dados de "+(data.user.display_name||data.user.username)+" · exportado em "+new Date(data.generated_at).toLocaleString("pt-BR");
      $("contest").addEventListener("change",event=>{state.contestId=event.target.value;state.block="";state.subject="";state.search="";state.open.clear();$("search").value="";render()});$("block-filter").addEventListener("change",event=>{state.block=event.target.value;render()});$("subject-filter").addEventListener("change",event=>{state.subject=event.target.value;render()});$("search").addEventListener("input",event=>{state.search=event.target.value;render()});$("details").addEventListener("click",event=>{const topic=event.target.closest("[data-topic]");if(topic){const key=topic.dataset.topic;state.open.has(key)?state.open.delete(key):state.open.add(key);render();return}const sub=event.target.closest("[data-subtopic]");if(sub)showQuestions(sub)});$("modal-close").addEventListener("click",()=>$("modal").classList.add("hidden"));$("modal").addEventListener("click",event=>{if(event.target===$("modal"))$("modal").classList.add("hidden")});document.addEventListener("keydown",event=>{if(event.key==="Escape")$("modal").classList.add("hidden")});render();
    })();
  </script>
</body>
</html>
